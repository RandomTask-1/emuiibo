name: Build emuiibo

on:
  push:
    paths:
      - 'emuiibo/**'
      - 'overlay/**'
      - 'libultrahand'
      - 'Makefile'
      - '.github/workflows/emuiibo.yml'
  workflow_dispatch:

jobs:
  emuiibo:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      # Overrides the repo's rust-toolchain.toml (plain "nightly") so the pinned toolchain below is used
      RUSTUP_TOOLCHAIN: nightly-2026-06-28

    steps:
    # The container runs as root; git must be present before checkout so that submodules are cloned
    - name: Install packages
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git build-essential curl ca-certificates zip

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Pinned to the nightly the sysmodule is known to build with (build-std breaks on some nightlies)
    - name: Prepare Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-06-28
        components: rust-src

    - name: Prepare cargo-nx
      run: cargo install cargo-nx --git https://github.com/aarch64-switch-rs/cargo-nx

    # Built directly rather than via 'make emuiibo', which runs 'cargo update' and would ignore the committed Cargo.lock
    # cargo-nx does not report build failures in its exit code, so check for the output
    - name: Build sysmodule
      run: |
        cd emuiibo
        cargo nx build --release
        test -f target/aarch64-nintendo-switch-freestanding/release/emuiibo.nsp

    - name: Build overlay
      run: make -C overlay -j$(nproc)

    - name: Package
      run: make dist -o sysmodule -o overlay

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SdOut
        path: SdOut
        # The overlay lives in switch/.overlays, which upload-artifact@v4 skips by default
        include-hidden-files: true
